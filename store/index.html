<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FAA STORE</title>
<meta name="theme-color" content="#f5f5f7">
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#86868b;--line:rgba(29,29,31,.09);--glass:rgba(255,255,255,.66)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.intro{position:fixed;inset:0;z-index:50;background:#101012;color:#fff;display:grid;place-items:center;animation:introAway .9s cubic-bezier(.7,0,.2,1) 1.15s forwards}
.intro-inner{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.23em;text-transform:uppercase;animation:introText .8s cubic-bezier(.2,.8,.2,1) both}
.intro-dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 24px rgba(255,255,255,.6)}
@keyframes introText{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes introAway{to{transform:translateY(-102%);border-radius:0 0 40px 40px;visibility:hidden}}
.shell{height:100%;position:relative;isolation:isolate}
.nav{height:70px;position:absolute;inset:0 0 auto;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px);opacity:0;animation:rise .8s .95s ease forwards}
.brand{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;color:#6e6e73;font-size:12px;font-weight:600}

.hero{height:100%;display:grid;place-items:center;padding:92px 20px 46px;position:relative;z-index:3;text-align:center}
.copy{max-width:900px;opacity:0;animation:rise .9s 1.05s cubic-bezier(.2,.75,.2,1) forwards}
.kicker{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#6e6e73;margin-bottom:18px}
h1{margin:0;font-size:clamp(52px,9.2vw,118px);line-height:.88;letter-spacing:-.07em;font-weight:720;text-wrap:balance}
p{margin:24px auto 0;max-width:520px;font-size:clamp(16px,1.9vw,20px);line-height:1.55;color:#6e6e73;letter-spacing:-.015em}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:30px;padding:11px 16px;border-radius:999px;border:1px solid rgba(29,29,31,.09);background:rgba(255,255,255,.68);box-shadow:0 8px 30px rgba(0,0,0,.05);backdrop-filter:blur(16px);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#1d1d1f;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.25;transform:scale(.75)}}
.shape{position:absolute;z-index:1;border:1px solid rgba(29,29,31,.07);background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.34));box-shadow:0 24px 70px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px);will-change:transform;transition:transform .18s ease-out}
.s1{width:clamp(110px,15vw,210px);height:clamp(145px,20vw,280px);left:6vw;top:18vh;border-radius:36px;transform:rotate(-10deg)}
.s2{width:clamp(130px,18vw,250px);height:clamp(82px,10vw,132px);right:5vw;top:22vh;border-radius:999px;transform:rotate(8deg)}
.s3{width:clamp(110px,14vw,190px);aspect-ratio:1;right:12vw;bottom:7vh;border-radius:42%;transform:rotate(18deg)}
.s4{width:clamp(100px,13vw,175px);height:clamp(68px,9vw,115px);left:13vw;bottom:10vh;border-radius:30px;transform:rotate(7deg)}
.s1::after,.s3::after{content:"";position:absolute;inset:16%;border-radius:inherit;border:1px solid rgba(29,29,31,.06)}
.line{position:absolute;z-index:0;inset:12% 8%;border:1px solid rgba(29,29,31,.055);border-radius:50%;transform:rotate(-7deg) scaleX(1.08);opacity:.8}
.line.two{inset:24% 2%;transform:rotate(10deg) scaleX(1.04)}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.028;background-image:radial-gradient(#000 0.55px,transparent .55px);background-size:5px 5px;mix-blend-mode:multiply;z-index:7}
.bottom-note{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:8;color:#86868b;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:0;animation:rise .8s 1.25s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:720px){.nav{height:62px}.status span{display:none}.s1{left:-34px;top:18%}.s2{right:-54px;top:24%}.s3{right:-22px;bottom:11%}.s4{left:-22px;bottom:14%}.line{inset:14% -40%}.line.two{inset:28% -55%}h1{font-size:clamp(50px,17vw,82px)}p{font-size:16px;max-width:310px}.bottom-note{bottom:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.intro{display:none}.copy,.nav,.bottom-note{opacity:1}}
</style>
</head>
<body>
<div class="intro"><div class="intro-inner"><span class="intro-dot"></span><span>FAA STORE</span></div></div>
<div class="shell" id="shell">
  <div class="nav"><div class="brand">FAA STORE</div><div class="status"><i></i><span>╰┈➤ not open yet </span></div></div>
  <div class="line"></div><div class="line two"></div>
  <div class="shape s1" data-depth="10"></div>
  <div class="shape s2" data-depth="6"></div>
  <div class="shape s3" data-depth="12"></div>
  <div class="shape s4" data-depth="8"></div>
  <main class="hero">
    <div class="copy">
      <div class="kicker">FAA STORE</div>
      <h1>YOU’RE<br>A LITTLE EARLY.</h1>
      <h3>Good timing. Wrong day.</h3>
      <p>A small store for apps and useful tools. -`♡´-</p>
      <div class="pill">MY BAD</div>
    </div>
  </main>
  <div class="bottom-note">SEE YOU AROUND.</div>
  <div class="noise"></div>
</div>
<script>
(() => {
  const shapes=[...document.querySelectorAll('[data-depth]')];
  let tx=0,ty=0,cx=0,cy=0,raf=0;
  function animate(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;shapes.forEach(el=>{const d=Number(el.dataset.depth||8);el.style.translate=`${cx*d}px ${cy*d}px`});raf=requestAnimationFrame(animate)}
  addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5)});
  addEventListener('pointerleave',()=>{tx=0;ty=0});
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)animate();
})();
</script>
</body>
</html>
